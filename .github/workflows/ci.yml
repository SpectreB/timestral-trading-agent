# Development guardrails (D-009): lint, type check, tests with coverage and secret detection
# on every push and pull request.
# The trading workflow will only run on a green main branch.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies (CPU-only PyTorch)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy

      - name: Tests with coverage (pytest)
        run: pytest --cov=agent --cov-report=term-missing

  secrets:
    # Secret detection on the full history (D-009). Runs the same gitleaks version as the
    # local pre-commit hook, on the whole history: independent of the push range, so it
    # also works after a history rewrite.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.24.2"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version

      - name: Scan the full git history
        run: ./gitleaks git . --redact --verbose
