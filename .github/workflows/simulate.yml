# Simulations requested by the evaluators (D-017).
#
# The dashboard's "Run a simulation" button opens a pre-filled issue titled "Simulation request".
# This workflow runs one full cycle on the current portfolio WITHOUT sending any order, posts the
# decision in the issue and closes it. The issue text is untrusted: no shell step ever sees it.
# One step receives it as an environment variable, and only `agent.simulate.parse_options` reads
# it, keeping three words from closed lists (agent, stance, start); everything else is dropped.
# The issue number and the author's login (set by GitHub) are used through env variables too.
name: Simulate

on:
  issues:
    types: [opened]

permissions:
  contents: write # push the simulation record to the audit-log branch
  issues: write # reply in the issue and close it

# One simulation at a time; GitHub keeps at most one waiting.
concurrency:
  group: simulation
  cancel-in-progress: false

jobs:
  simulate:
    if: startsWith(github.event.issue.title, 'Simulation request')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ISSUE: ${{ github.event.issue.number }}
      REQUESTER: ${{ github.event.issue.user.login }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Acknowledge
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Simulation started ([follow it here]($RUN_URL)). The answer will be posted here in about 6 minutes. No order will be sent."

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          ref: audit-log
          path: audit

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache Timestral weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-timestral-28M-209M-v1  # the tool agent runs the 209M model

      - name: Install (CPU-only PyTorch)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install --no-deps -e .

      - name: Run the simulation (never trades)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_TOOLS_API_KEY: ${{ secrets.ALPACA_TOOLS_API_KEY }}
          ALPACA_TOOLS_SECRET_KEY: ${{ secrets.ALPACA_TOOLS_SECRET_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          OPTIONS: ${{ github.event.issue.body }}
          TRADING_ENABLED: "false"
        run: python -m agent.simulate --audit-dir audit --requested-by "$REQUESTER" --comment-out comment.md

      - name: Publish the simulation record
        run: |
          python -c "from pathlib import Path; from agent.audit import FileAuditStore; FileAuditStore(Path('audit/simulations')).build_tables()" || true
          cd audit
          git config user.name "trading-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Simulation requested in issue #${ISSUE}"
          git pull --rebase origin audit-log
          git push origin HEAD:audit-log

      - name: Reply and close
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"

      - name: Report a failure
        if: failure()
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "The simulation failed. [Logs]($RUN_URL). Nothing was traded."
