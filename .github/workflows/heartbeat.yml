# Scheduler test: does GitHub fire scheduled workflows for this repository at all?
#
# No scheduled run of Trade or Smoke test has ever started, although both workflows start fine
# when dispatched by hand. This workflow does nothing but print the time, every 5 minutes. It
# has no secret and no permission beyond reading, and it trades nothing. If it never appears in
# the Actions tab, GitHub's scheduler is not firing for this repository, and the cause is not our
# code, variables or secrets. To be removed once the scheduling question is settled.
name: Heartbeat

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Print the time
        run: |
          echo "event=${{ github.event_name }}"
          date -u +"%Y-%m-%dT%H:%M:%SZ"
