[project]
name = "timestral-trading-agent"
version = "0.1.0"
description = "Autonomous paper-trading agent: Timestral forecasts, Mistral LLM decisions, deterministic guardrails, Alpaca execution."
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# --- Ruff: linter + formatter -------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["*.md"]  # keep code blocks in docs hand-formatted

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes (unused imports, undefined names)
    "I",       # import sorting
    "B",       # bugbear (likely bugs)
    "UP",      # pyupgrade (modern syntax)
    "SIM",     # simplifications
    "RUF",     # ruff-specific checks
]

# --- Mypy: static type checking (strict on the agent package) ----------------
[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages without type information
module = ["timestral.*", "alpaca.*", "yfinance.*"]
ignore_missing_imports = true

# --- Pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

# --- Coverage ----------------------------------------------------------------
[tool.coverage.run]
source = ["agent"]
branch = true

[tool.coverage.report]
show_missing = true
